/* Layout: header(title + lang-toggle) → tab-nav → flex(sidebar 1 / content 4) */
:root {
  --bg:          #F5F4F1;
  --surface:     #FFFFFF;
  --fg:          #1C1B19;
  --fg-muted:    #706D64;
  --border:      #DDD9D0;
  --accent:      #2D5A3D;
  --accent-soft: #EBF2ED;
  --shadow:      0 1px 4px rgba(0,0,0,.07);
  --font-d: 'Playfair Display', Georgia, serif;
  --font-u: 'Inter', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:          #131311;
    --surface:     #1D1C1A;
    --fg:          #E8E5DF;
    --fg-muted:    #928F86;
    --border:      #2C2B27;
    --accent:      #4A9060;
    --accent-soft: #182A1E;
    --shadow:      0 1px 4px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:          #131311;
  --surface:     #1D1C1A;
  --fg:          #E8E5DF;
  --fg-muted:    #928F86;
  --border:      #2C2B27;
  --accent:      #4A9060;
  --accent-soft: #182A1E;
  --shadow:      0 1px 4px rgba(0,0,0,.3);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-u);
  font-size: 15px;
  line-height: 1.6;
  padding-left:  max(24px, env(safe-area-inset-left,  0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}

/* ── Header ── */
.site-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 0;
  margin-bottom: 22px;
}
.site-title {
  font-family: var(--font-d);
  font-size: 1.45rem;
  font-weight: 600;
  letter-spacing: -.02em;
  color: var(--fg);
  margin: 0;
}
.site-title em { font-style: normal; color: var(--accent); }

/* ── Language toggle ── */
.lang-toggle {
  display: flex;
  gap: 2px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 3px;
  flex-shrink: 0;
}
.lang-btn {
  background: none;
  border: none;
  border-radius: 5px;
  padding: 4px 11px;
  font-family: var(--font-u);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: .06em;
  color: var(--fg-muted);
  cursor: pointer;
  transition: background .15s, color .15s;
}
.lang-btn.active { background: var(--accent); color: #fff; }
.lang-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Tab nav ── */
.tab-nav {
  display: flex;
  border-bottom: 1px solid var(--border);
  margin-bottom: 26px;
}
.tab-btn {
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  padding: 9px 22px;
  font-family: var(--font-u);
  font-size: .875rem;
  font-weight: 500;
  color: var(--fg-muted);
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.tab-btn:hover { color: var(--fg); }
.tab-btn.active { color: var(--fg); border-bottom-color: var(--accent); }
.tab-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

/* ── Tab panels ── */
.tab-panel { display: none; }
.tab-panel.active { display: flex; gap: 24px; align-items: flex-start; }

/* ── Sidebar ── */
.sidebar { flex: 1; min-width: 0; max-width: 190px; position: sticky; top: 16px; }
.sidebar-box {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 16px;
  background: var(--surface);
  box-shadow: var(--shadow);
}
.sidebar-heading {
  font-size: .7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .1em;
  color: var(--fg-muted);
  margin: 0 0 14px;
}
.link-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 9px; }
.link-list a {
  font-size: .875rem;
  font-weight: 500;
  color: var(--accent);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 5px;
}
.link-list a::before { content: '↗'; font-size: .7rem; opacity: .6; }
.link-list a:hover { text-decoration: underline; }

/* ── Content ── */
.content { flex: 4; min-width: 0; padding-bottom: 52px; }

/* ── News feed ── */
.news-feed { display: flex; flex-direction: column; gap: 36px; max-width: 660px; }

.news-meta { font-size: .78rem; color: var(--fg-muted); margin-bottom: 9px; font-variant-numeric: tabular-nums; }

.news-headline {
  font-family: var(--font-d);
  font-size: 1.55rem;
  font-weight: 600;
  line-height: 1.3;
  color: var(--fg);
  margin: 0 0 18px;
  text-wrap: balance;
}

.news-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px 24px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

/* Quote style */
.quote-block { display: flex; flex-direction: column; gap: 12px; }
.quote-line {
  font-family: var(--font-d);
  font-style: italic;
  font-size: 1.04rem;
  line-height: 1.65;
  color: var(--fg);
  margin: 0;
  padding-left: 16px;
  border-left: 2px solid var(--accent);
}

/* Project mini-list style */
.proj-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.proj-list li { display: flex; flex-direction: column; gap: 2px; }
.proj-name { font-weight: 600; color: var(--fg); font-size: .9rem; }
.proj-name em { font-style: normal; color: var(--accent); margin-right: 4px; }
.proj-blurb { font-size: .85rem; color: var(--fg-muted); line-height: 1.5; }

/* Divider between posts */
.news-divider { border: none; border-top: 1px solid var(--border); }

/* ── Empty state ── */
.empty-state { padding: 40px 0; color: var(--fg-muted); font-size: .875rem; }

/* ── Portfolio ── */
.portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }

.tile {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  background: var(--surface);
  box-shadow: var(--shadow);
  transition: border-color .15s, transform .1s;
  display: flex;
  flex-direction: column;
  gap: 0;
}
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }

.tile-tag {
  display: inline-block;
  font-size: .68rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .08em;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: 4px;
  margin-bottom: 10px;
  align-self: flex-start;
}
.tile-name { font-family: var(--font-d); font-size: 1.1rem; font-weight: 600; color: var(--fg); margin: 0 0 8px; }
.tile-desc { font-size: .84rem; color: var(--fg-muted); line-height: 1.55; margin: 0 0 12px; flex: 1; }

.tile-stack { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
.badge {
  font-size: .7rem;
  color: var(--fg-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 7px;
}

.tile-footer { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; display: flex; flex-direction: column; gap: 6px; }
.tile-link { font-size: .8rem; color: var(--accent); text-decoration: none; display: flex; align-items: center; gap: 5px; }
.tile-link::before { content: '↗'; font-size: .7rem; opacity: .6; }
.tile-link:hover { text-decoration: underline; }
.tile-access { font-size: .78rem; color: var(--fg-muted); display: flex; align-items: center; gap: 6px; }
.tile-access::before { content: '🔒'; font-size: .75rem; }
.tile-contact { font-size: .78rem; color: var(--accent); font-weight: 500; }
.tile-diagram { margin: 8px 0 4px; }

/* ── Portfolio intro ── */
.portfolio-intro { max-width: 660px; margin-bottom: 24px; }
.portfolio-intro p { font-size: .88rem; color: var(--fg-muted); line-height: 1.65; margin: 0; }

/* ── Stack label ── */
.stack-label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-muted); display: block; margin-bottom: 5px; }

/* ── Accordion ── */
.tile-accordion { border-top: 1px solid var(--border); padding-top: 10px; margin: 8px 0 4px; }
.accordion-btn {
  background: none; border: none; padding: 0; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; color: var(--fg-muted); font-family: var(--font-u);
  font-size: .8rem; font-weight: 500;
}
.accordion-btn:hover { color: var(--fg); }
.accordion-arrow { font-size: .65rem; opacity: .7; transition: transform .2s; display: inline-block; }
.tile-accordion.open .accordion-arrow { transform: rotate(90deg); }
.accordion-body { display: none; padding-top: 8px; }
.tile-accordion.open .accordion-body { display: block; }
.accordion-body p { font-size: .84rem; color: var(--fg-muted); line-height: 1.55; margin: 0; }

/* ── Responsive ── */
@media (max-width: 600px) {
  .tab-panel.active { flex-direction: column; }
  .sidebar { max-width: 100%; position: static; }
  .portfolio-grid { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) {
  .portfolio-grid { grid-template-columns: 1fr; }
  .tab-btn { padding: 9px 14px; }
  .site-title { font-size: 1.2rem; }
}
</style>

<!-- ── HEADER ── -->
<header class="site-header">

/* ══════════════════════════════════════════
   STATE
══════════════════════════════════════════ */
let currentLang = 'ru';

/* ══════════════════════════════════════════
   TAB SWITCHING
══════════════════════════════════════════ */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.classList.remove('active');
      b.setAttribute('aria-selected', 'false');
    });
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    btn.setAttribute('aria-selected', 'true');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

/* ══════════════════════════════════════════
   LANGUAGE TOGGLE
══════════════════════════════════════════ */
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentLang = btn.dataset.lang;
    document.querySelectorAll('.lang-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.lang === currentLang)
    );
    applyTranslations();
    renderNews();
    renderPortfolio();
  });
});

function applyTranslations() {
  const t = T[currentLang];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (t[key] !== undefined) el.textContent = t[key];
  });
}

/* ══════════════════════════════════════════
   RENDER NEWS
══════════════════════════════════════════ */
function formatDate(date, lang) {
  return date.toLocaleDateString(lang === 'ru' ? 'ru-RU' : 'en-US', {
    day: 'numeric', month: 'long', year: 'numeric'
  });
}

function renderNews() {
  const feed = document.getElementById('news-feed');
  feed.innerHTML = '';
  const l = currentLang;

  newsData.forEach((item, idx) => {
    const dateObj = item.date || new Date();

    // Meta
    const meta = document.createElement('div');
    meta.className = 'news-meta';
    meta.textContent = formatDate(dateObj, l);

    // Headline
    const h = document.createElement('h2');
    h.className = 'news-headline';
    h.textContent = item.title[l];

    // Card
    const card = document.createElement('div');
    card.className = 'news-card';

    if (item.type === 'quotes') {
      const block = document.createElement('div');
      block.className = 'quote-block';
      item.quotes[l].forEach(q => {
        const p = document.createElement('p');
        p.className = 'quote-line';
        p.textContent = q;
        block.appendChild(p);
      });
      card.appendChild(block);
    } else if (item.type === 'projects') {
      const intro = document.createElement('p');
      intro.style.cssText = 'margin:0 0 16px;font-size:.9rem;color:var(--fg-muted)';
      intro.textContent = item.intro[l];
      card.appendChild(intro);

      const ul = document.createElement('ul');
      ul.className = 'proj-list';
      item.projects.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML =
          `<span class="proj-name"><em>${p.name}</em></span>` +
          `<span class="proj-blurb">${p.desc[l]}</span>`;
        ul.appendChild(li);
      });
      card.appendChild(ul);
    }

    // Wrap in article
    const article = document.createElement('article');
    article.appendChild(meta);
    article.appendChild(h);
    article.appendChild(card);
    feed.appendChild(article);

    if (idx < newsData.length - 1) {
      feed.appendChild(document.createElement('hr')).className = 'news-divider';
    }
  });
}

/* ══════════════════════════════════════════
   RENDER PORTFOLIO
══════════════════════════════════════════ */
function renderPortfolio() {
  const grid   = document.getElementById('portfolio-grid');
  const intro  = document.getElementById('portfolio-intro');
  const slinks = document.getElementById('portfolio-sidebar-links');
  const l = currentLang;
  const t = T[l];

  intro.innerHTML = `<p>${t.portfolio_intro}</p>`;
  grid.innerHTML = '';
  slinks.innerHTML = '';

  const tgIcon =
    `<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" ` +
    `fill="currentColor" style="flex-shrink:0;vertical-align:middle">` +
    `<path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.562 ` +
    `8.248-2.05 9.657c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605` +
    `.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L7.48 14.697l-2.95-.924c-.642-.2-` +
    `.655-.642.136-.953l11.527-4.447c.537-.194 1.006.131.37.875z"/></svg>`;

  portfolioData.forEach(p => {
    // Sidebar link
    const li = document.createElement('li');
    li.innerHTML = `<a href="${p.github}" target="_blank" rel="noopener">${p.name}</a>`;
    slinks.appendChild(li);

    // Tile
    const tile = document.createElement('div');
    tile.className = 'tile';

    const stackBadges = p.stack.map(s => `<span class="badge">${s}</span>`).join('');
    const diagramHtml = p.diagram ? `<div class="tile-diagram">${p.diagram(l)}</div>` : '';

    tile.innerHTML =
      `<span class="tile-tag">${p.tag[l]}</span>` +
      `<h3 class="tile-name">${p.name}</h3>` +
      diagramHtml +
      `<div class="tile-accordion">` +
        `<button class="accordion-btn" onclick="this.parentElement.classList.toggle('open')">` +
          `<span>${t.accordion_label}</span>` +
          `<span class="accordion-arrow">▸</span>` +
        `</button>` +
        `<div class="accordion-body"><p>${p.desc[l]}</p></div>` +
      `</div>` +
      `<div class="tile-stack"><span class="stack-label">${t.stack_label}</span>${stackBadges}</div>` +
      `<div class="tile-footer">` +
        `<a class="tile-link" href="${p.github}" target="_blank" rel="noopener">GitHub</a>` +
        `<a class="tile-link" href="${p.url}" target="_blank" rel="noopener">${p.url.replace('https://','')}</a>` +
        `<span class="tile-access">${t.access_note}</span>` +
        `<span class="tile-contact">${t.contact_prefix} ` +
          `<a class="tile-link" href="https://t.me/awitalii" target="_blank" rel="noopener" ` +
          `style="display:inline-flex;align-items:center;gap:3px">${tgIcon}@awitalii</a></span>` +
      `</div>`;

    grid.appendChild(tile);
  });
}

/* ══════════════════════════════════════════
   INIT
══════════════════════════════════════════ */
renderNews();
renderPortfolio();
applyTranslations();
</script>
