<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Битва Замков · Звериная серия</title>
  <link rel="stylesheet" href="Castles.css">
</head>
<body>
  <div class="game-container">
    
    <!-- Шапка -->
    <div class="game-header">
      <h1><span>🏰</span> Битва Замков</h1>
      <div class="turn-indicator" id="turnIndicator">
        <span class="mark" id="turnAnimal" style="font-size: 1.2rem;">🦊</span>
        <span id="turnText">ход игрока 1</span>
      </div>
    </div>

    <!-- Игровое поле -->
    <div class="canvas-wrap">
      <canvas id="gameCanvas"></canvas>
      
      <div class="game-over-overlay" id="gameOverOverlay">
        <div class="game-over-badge" id="gameOverBadge">🏆</div>
        <div class="game-over-title" id="gameOverTitle">Игрок 1 побеждает!</div>
        <button class="btn" id="overlayRestartButton" style="margin-top: 1rem;">↻ Следующая игра</button>
      </div>
    </div>

    <!-- Управление -->
    <div class="controls">
      <div class="control-group">
        <label>Угол стрельбы: <span id="angleValue">45°</span></label>
        <input type="range" id="angleSlider" min="10" max="80" value="45">
      </div>
      <div class="control-group">
        <label>Сила: <span id="powerValue">50%</span></label>
        <input type="range" id="powerSlider" min="10" max="100" value="50">
      </div>
      <button class="btn fire-btn" id="fireButton">🔥 Выстрел!</button>
    </div>

    <!-- Карточки игроков и счёт -->
    <div class="players-row">
      <div class="player-card p1" id="player1Card">
        <span class="first-move-badge">⭐ первый</span>
        <span class="player-label">Игрок 1</span>
        <span class="player-avatar" id="p1Avatar">🦊</span>
        <button class="player-name-btn" data-player="1">сменить</button>
        <div class="hp-bar-small"><div class="hp-fill-small" id="p1HpFill" style="width: 100%;"></div></div>
      </div>

      <div class="scoreboard">
        <div class="score-main" id="seriesScore">0 : 0</div>
        <div class="score-sub" id="seriesInfo">ничьи 0 · игра 1</div>
        <div class="wind-stat">
          Ветер: <span id="windText">0 м/с</span>
        </div>
      </div>

      <div class="player-card p2" id="player2Card">
        <span class="first-move-badge">⭐ первый</span>
        <span class="player-label">Игрок 2</span>
        <span class="player-avatar" id="p2Avatar">🐼</span>
        <button class="player-name-btn" data-player="2">сменить</button>
        <div class="hp-bar-small"><div class="hp-fill-small" id="p2HpFill" style="width: 100%;"></div></div>
      </div>
    </div>

  </div>

  <!-- Модалка выбора зверька -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 id="modalTitle">Выбери зверька</h2>
      <p id="modalSubtitle">Игрок 1, кто ты?</p>
      <div class="animal-grid" id="animalGrid"></div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel">отмена</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI
    const angleSlider = document.getElementById('angleSlider');
    const powerSlider = document.getElementById('powerSlider');
    const angleValue = document.getElementById('angleValue');
    const powerValue = document.getElementById('powerValue');
    const fireButton = document.getElementById('fireButton');
    const turnAnimal = document.getElementById('turnAnimal');
    const turnText = document.getElementById('turnText');
    
    const p1AvatarEl = document.getElementById('p1Avatar');
    const p2AvatarEl = document.getElementById('p2Avatar');
    const p1Card = document.getElementById('player1Card');
    const p2Card = document.getElementById('player2Card');
    
    const p1HpFill = document.getElementById('p1HpFill');
    const p2HpFill = document.getElementById('p2HpFill');
    const seriesScore = document.getElementById('seriesScore');
    const seriesInfo = document.getElementById('seriesInfo');
    const windText = document.getElementById('windText');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const modalOverlay = document.getElementById('modalOverlay');

    // Константы
    const GRAVITY = 0.15;
    const WIND_MULTIPLIER = 0.01;
    const MAX_HP = 100;
    const BLOCK_SIZE = 8; // Уменьшили размер кирпичиков (было 12)
    const DAMAGE_PER_HIT = 20;

    // Состояние
    let width = canvas.width = 800;
    let height = canvas.height = 500;
    let terrainPoints = [];
    let currentPlayer = 1;
    let firstMover = 1;
    let isFiring = false;
    let projectile = null;
    let particles = [];
    let wind = 0;
    let gameActive = true;
    let shakeTime = 0;

    // Серия
    let score = { p1: 0, p2: 0, ties: 0 };
    let gameNumber = 1;
    let player1Animal = '🦊';
    let player2Animal = '🐼';
    let modalTargetPlayer = null;

    let p1 = { x: 150, y: 0, hp: MAX_HP, blocks: [] };
    let p2 = { x: 650, y: 0, hp: MAX_HP, blocks: [] };

    const ANIMALS = ['🦊', '🐼', '🐸', '🦁', '🐨', '🐯', '🐰', '🐻', '🐮', '🐷', '🐵', '🦉'];
    const STORAGE_KEY = 'castles_game_state';

    // --- LOCALSTORAGE ---
    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          player1Animal, player2Animal, score, gameNumber, firstMover
        }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (data.player1Animal && ANIMALS.includes(data.player1Animal)) player1Animal = data.player1Animal;
        if (data.player2Animal && ANIMALS.includes(data.player2Animal)) player2Animal = data.player2Animal;
        if (data.score && typeof data.score.p1 === 'number') {
          score = { p1: data.score.p1 || 0, p2: data.score.p2 || 0, ties: data.score.ties || 0 };
        }
        if (typeof data.gameNumber === 'number' && data.gameNumber >= 1) gameNumber = data.gameNumber;
        if (data.firstMover === 1 || data.firstMover === 2) firstMover = data.firstMover;
        else firstMover = (gameNumber % 2 === 1) ? 1 : 2;
      } catch (e) {}
    }

    // --- ГЕНЕРАЦИЯ РЕЛЬЕФА (Более изощренный) ---
    function resizeCanvas() {
      const wrap = canvas.parentElement;
      canvas.width = wrap.clientWidth;
      canvas.height = wrap.clientHeight;
      width = canvas.width;
      height = canvas.height;
      
      p1.x = width * 0.15;
      p2.x = width * 0.85;
      
      generateTerrain();
      initCastles();
      draw();
    }

    function generateTerrain() {
      terrainPoints = [];
      // Увеличили количество сегментов для большей детализации
      const segments = 250; 
      const segmentWidth = width / segments;
      
      // Множественные синусоиды разной частоты для "рваного" эффекта
      const seed1 = Math.random() * 100;
      const seed2 = Math.random() * 100;
      const seed3 = Math.random() * 100;
      const seed4 = Math.random() * 100;
      
      for (let i = 0; i <= segments; i++) {
        const x = i * segmentWidth;
        let y = height * 0.65;
        y += Math.sin(x * 0.008 + seed1) * 80;
        y += Math.sin(x * 0.02 + seed2) * 30;
        y += Math.cos(x * 0.04 + seed3) * 15; // Высокочастотные скалы
        y += Math.sin(x * 0.1 + seed4) * 5;   // Совсем мелкие камни
        
        y = Math.max(height * 0.2, Math.min(height * 0.9, y));
        terrainPoints.push({ x, y });
      }
    }

    function getTerrainY(targetX) {
      for (let i = 0; i < terrainPoints.length - 1; i++) {
        const p1 = terrainPoints[i];
        const p2 = terrainPoints[i + 1];
        if (targetX >= p1.x && targetX <= p2.x) {
          const t = (targetX - p1.x) / (p2.x - p1.x);
          return p1.y + (p2.y - p1.y) * t;
        }
      }
      return height * 0.65;
    }

    // Разрушение рельефа (создание кратера)
    function destroyTerrain(hitX, hitY, radius) {
      for (let i = 0; i < terrainPoints.length; i++) {
        const pt = terrainPoints[i];
        const dist = Math.hypot(pt.x - hitX, pt.y - hitY);
        
        if (dist < radius) {
          // Чем ближе к центру, тем глубже кратер
          const depth = Math.cos((dist / radius) * Math.PI * 0.5) * radius * 0.8;
          pt.y += depth;
          // Ограничиваем, чтобы не провалиться в бездну
          pt.y = Math.min(pt.y, height * 0.95);
        }
      }
    }

    // --- ЗАМКИ (Уменьшенные) ---
    function initCastles() {
      p1.y = getTerrainY(p1.x);
      p2.y = getTerrainY(p2.x);
      p1.blocks = createCastleBlocks(p1.x, p1.y, true);
      p2.blocks = createCastleBlocks(p2.x, p2.y, false);
    }

    function createCastleBlocks(cx, cy, isP1) {
      const blocks = [];
      // Уменьшили габариты замка (было 36x48, стало 24x32)
      const structure = [
        { dx: -12, dy: -32, w: 24, h: 32, part: 'tower' },
        { dx: -28, dy: -16, w: 16, h: 16, part: 'left_wall' },
        { dx: 12, dy: -16, w: 16, h: 16, part: 'right_wall' },
      ];

      structure.forEach(part => {
        for (let y = 0; y < part.h; y += BLOCK_SIZE) {
          for (let x = 0; x < part.w; x += BLOCK_SIZE) {
            const blockW = Math.min(BLOCK_SIZE, part.w - x);
            const blockH = Math.min(BLOCK_SIZE, part.h - y);
            blocks.push({
              x: cx + part.dx + x, y: cy + part.dy + y,
              w: blockW, h: blockH, vx: 0, vy: 0,
              active: true, isFlying: false,
              part: part.part,
              color: isP1 ? '#c96d9c' : '#688bb8'
            });
          }
        }
      });
      return blocks;
    }

    // --- ОТРИСОВКА ---
    function draw() {
      ctx.save();
      if (shakeTime > 0) {
        ctx.translate((Math.random() - 0.5) * 10, (Math.random() - 0.5) * 10);
        shakeTime--;
      }

      ctx.clearRect(-20, -20, width + 40, height + 40);

      // Небо
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, '#f9eef7');
      skyGrad.addColorStop(1, '#f1e7f5');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(-20, -20, width + 40, height + 40);

      // Луна
      ctx.beginPath();
      ctx.arc(width * 0.85, height * 0.2, 40, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
      ctx.shadowBlur = 30;
      ctx.shadowColor = '#fff';
      ctx.fill();
      ctx.shadowBlur = 0;

      // Рельеф
      ctx.beginPath();
      ctx.moveTo(0, height);
      for (let p of terrainPoints) ctx.lineTo(p.x, p.y);
      ctx.lineTo(width, height);
      ctx.closePath();
      
      const terrainGrad = ctx.createLinearGradient(0, height * 0.4, 0, height);
      terrainGrad.addColorStop(0, '#b5a3bc');
      terrainGrad.addColorStop(1, '#9a8a9e');
      ctx.fillStyle = terrainGrad;
      ctx.fill();
      ctx.strokeStyle = '#c4b5c9';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Замки
      drawCastleBlocks(p1.blocks);
      drawCastleBlocks(p2.blocks);

      // Животные над замками
      ctx.font = '24px Arial'; // Чуть уменьшили шрифт
      ctx.textAlign = 'center';
      ctx.fillText(player1Animal, p1.x, p1.y - 50);
      ctx.fillText(player2Animal, p2.x, p2.y - 50);

      // Частицы
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.2; p.life--;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.fillStyle = `rgba(${p.color}, ${p.life / p.maxLife})`;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      // Снаряд
      if (projectile) {
        ctx.beginPath();
        ctx.arc(projectile.x, projectile.y, 12, 0, Math.PI * 2);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.font = '18px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(currentPlayer === 1 ? player1Animal : player2Animal, projectile.x, projectile.y);
        
        if (projectile.trail) {
          projectile.trail.forEach((pt, i) => {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 2, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(79, 59, 76, ${i / projectile.trail.length})`;
            ctx.fill();
          });
        }
      }

      // Прицел
      if (!isFiring && gameActive) {
        const current = currentPlayer === 1 ? p1 : p2;
        const angle = parseInt(angleSlider.value) * Math.PI / 180;
        const power = parseInt(powerSlider.value);
        const dir = currentPlayer === 1 ? 1 : -1;
        // Вылет из центра башни (учитывая новые размеры)
        const startX = current.x + 5 * dir;
        const startY = current.y - 32;
        
        ctx.beginPath();
        ctx.setLineDash([5, 5]);
        let simX = startX;
        let simY = startY;
        let simVx = Math.cos(angle) * power * 0.2 * dir;
        let simVy = -Math.sin(angle) * power * 0.2;
        
        for (let i = 0; i < 40; i++) {
          simVy += GRAVITY;
          simVx += wind * WIND_MULTIPLIER;
          simX += simVx; simY += simVy;
          if (simY > height || simX < 0 || simX > width) break;
          if (i === 0) ctx.moveTo(simX, simY);
          else ctx.lineTo(simX, simY);
        }
        ctx.strokeStyle = 'rgba(201, 109, 156, 0.5)';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.restore();
    }

    function drawCastleBlocks(blocks) {
      for (let b of blocks) {
        if (!b.active && !b.isFlying) continue;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 1;
        ctx.strokeRect(b.x, b.y, b.w, b.h);
      }
    }

    // --- ЛОГИКА ---
    function updatePhysics() {
      let needsRedraw = false;

      [p1, p2].forEach(castle => {
        for (let b of castle.blocks) {
          if (b.isFlying) {
            b.vy += 0.5; b.x += b.vx; b.y += b.vy;
            const terrainY = getTerrainY(b.x);
            if (b.y + b.h > terrainY) {
              b.y = terrainY - b.h;
              b.vy *= -0.3; b.vx *= 0.8;
              if (Math.abs(b.vy) < 1) { b.vy = 0; b.vx = 0; }
            }
            needsRedraw = true;
          }
        }
      });

      if (projectile) {
        projectile.vy += GRAVITY;
        projectile.vx += wind * WIND_MULTIPLIER;
        projectile.x += projectile.vx;
        projectile.y += projectile.vy;
        
        projectile.trail.push({ x: projectile.x, y: projectile.y });
        if (projectile.trail.length > 15) projectile.trail.shift();
        
        checkCollisions();
        needsRedraw = true;
      }

      if (particles.length > 0) needsRedraw = true;
      if (needsRedraw) draw();
    }

    function checkCollisions() {
      const px = projectile.x;
      const py = projectile.y;

      let hitCastle = null;
      let hitBlock = null;

      for (let b of p1.blocks) {
        if (b.active && px > b.x && px < b.x + b.w && py > b.y && py < b.y + b.h) {
          hitCastle = p1; hitBlock = b; break;
        }
      }
      if (!hitCastle) {
        for (let b of p2.blocks) {
          if (b.active && px > b.x && px < b.x + b.w && py > b.y && py < b.y + b.h) {
            hitCastle = p2; hitBlock = b; break;
          }
        }
      }

      if (hitCastle && hitBlock) {
        explode(px, py);
        const partToDestroy = hitBlock.part;
        for (let b of hitCastle.blocks) {
          if (b.active && b.part === partToDestroy) {
            b.active = false;
            b.isFlying = true;
            b.vx = (b.x - px) * 0.15 + (Math.random() - 0.5) * 6;
            b.vy = (b.y - py) * 0.15 - Math.random() * 6;
          }
        }
        damageCastle(hitCastle);
        endTurn();
        return;
      }

      // Попадание в землю
      const terrainY = getTerrainY(px);
      if (py >= terrainY) {
        explode(px, terrainY);
        destroyTerrain(px, terrainY, 40); // Выбиваем воронку радиусом 40
        endTurn();
        return;
      }

      if (px < 0 || px > width || py > height) endTurn();
    }

    function damageCastle(castle) {
      castle.hp = Math.max(0, castle.hp - DAMAGE_PER_HIT);
      updateStats();
      if (castle.hp <= 0) endGame(castle === p1 ? 2 : 1);
    }

    function explode(x, y) {
      shakeTime = 15;
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 2,
          life: 30 + Math.random() * 20,
          maxLife: 50,
          size: Math.random() * 6 + 2,
          color: Math.random() > 0.5 ? '201, 109, 156' : '180, 170, 190'
        });
      }
    }

    // --- УПРАВЛЕНИЕ ---
    function fire() {
      if (!gameActive || isFiring) return;
      isFiring = true;
      
      const current = currentPlayer === 1 ? p1 : p2;
      const angle = parseInt(angleSlider.value) * Math.PI / 180;
      const power = parseInt(powerSlider.value);
      const dir = currentPlayer === 1 ? 1 : -1;
      
      const startX = current.x + 5 * dir;
      const startY = current.y - 32;
      
      projectile = {
        x: startX, y: startY,
        vx: Math.cos(angle) * power * 0.2 * dir,
        vy: -Math.sin(angle) * power * 0.2,
        trail: []
      };
      
      wind = (Math.random() - 0.5) * 15;
      windText.textContent = `${wind > 0 ? '→' : '←'} ${Math.abs(wind).toFixed(1)} м/с`;
      
      requestAnimationFrame(gameLoop);
    }

    function endTurn() {
      isFiring = false;
      projectile = null;
      if (!gameActive) return;

      currentPlayer = currentPlayer === 1 ? 2 : 1;
      updateTurnUI();
      draw();
    }

    function updateTurnUI() {
      turnText.textContent = `ход игрока ${currentPlayer}`;
      turnAnimal.textContent = currentPlayer === 1 ? player1Animal : player2Animal;
      
      p1Card.classList.remove('active');
      p2Card.classList.remove('active');
      
      if (gameActive) {
        if (currentPlayer === 1) p1Card.classList.add('active');
        else p2Card.classList.add('active');
      }
    }

    function updateStats() {
      p1HpFill.style.width = `${p1.hp}%`;
      if(p1.hp <= 40) p1HpFill.style.background = '#ef4444';
      else p1HpFill.style.background = '#4ade80';
      
      p2HpFill.style.width = `${p2.hp}%`;
      if(p2.hp <= 40) p2HpFill.style.background = '#ef4444';
      else p2HpFill.style.background = '#4ade80';
    }

    function updateScoreUI() {
      seriesScore.textContent = `${score.p1} : ${score.p2}`;
      seriesInfo.textContent = `ничьи ${score.ties} · игра ${gameNumber}`;
      
      p1Card.classList.remove('first-mover');
      p2Card.classList.remove('first-mover');
      if (firstMover === 1) p1Card.classList.add('first-mover');
      else p2Card.classList.add('first-mover');
    }

    function endGame(winner) {
      gameActive = false;
      
      if (winner === 1) score.p1++;
      else if (winner === 2) score.p2++;
      else if (winner === 'tie') score.ties++;
      
      saveState();
      
      p1Card.classList.remove('active');
      p2Card.classList.remove('active');
      if (winner === 1) p1Card.classList.add('active');
      if (winner === 2) p2Card.classList.add('active');

      gameOverOverlay.classList.add('visible');
      document.getElementById('gameOverTitle').textContent = `Игрок ${winner} побеждает!`;
      document.getElementById('gameOverBadge').textContent = winner === 1 ? player1Animal : player2Animal;
      
      updateScoreUI();
    }

    function gameLoop() {
      if (!isFiring && particles.length === 0) return;
      updatePhysics();
      requestAnimationFrame(gameLoop);
    }

    // --- МОДАЛКА ВЫБОРА ЗВЕРЬКА ---
    function openAnimalModal(playerNum) {
      modalTargetPlayer = playerNum;
      document.getElementById('modalTitle').textContent = `Игрок ${playerNum}, выбери зверька`;
      
      const grid = document.getElementById('animalGrid');
      grid.innerHTML = '';
      
      const currentChoice = playerNum === 1 ? player1Animal : player2Animal;
      const otherChoice = playerNum === 1 ? player2Animal : player1Animal;

      ANIMALS.forEach(animal => {
        const el = document.createElement('div');
        el.className = 'animal-option';
        el.textContent = animal;
        
        if (animal === currentChoice) el.classList.add('selected');
        if (animal === otherChoice) el.classList.add('disabled');

        el.addEventListener('click', () => {
          if (playerNum === 1) player1Animal = animal;
          else player2Animal = animal;
          
          p1AvatarEl.textContent = player1Animal;
          p2AvatarEl.textContent = player2Animal;
          saveState();
          updateTurnUI();
          draw();
          
          closeModal();
        });
        grid.appendChild(el);
      });

      modalOverlay.classList.add('open');
    }

    function closeModal() {
      modalOverlay.classList.remove('open');
      modalTargetPlayer = null;
    }

    // --- ИНИЦИАЛИЗАЦИЯ ---
    angleSlider.addEventListener('input', (e) => {
      angleValue.textContent = `${e.target.value}°`;
      if (!isFiring) draw();
    });
    
    powerSlider.addEventListener('input', (e) => {
      powerValue.textContent = `${e.target.value}%`;
      if (!isFiring) draw();
    });
    
    fireButton.addEventListener('click', fire);
    window.addEventListener('resize', resizeCanvas);
    
    document.getElementById('overlayRestartButton').addEventListener('click', () => {
      gameActive = true;
      p1.hp = MAX_HP;
      p2.hp = MAX_HP;
      
      firstMover = firstMover === 1 ? 2 : 1;
      currentPlayer = firstMover;
      gameNumber++;
      
      updateTurnUI();
      updateStats();
      updateScoreUI();
      
      generateTerrain();
      initCastles();
      
      gameOverOverlay.classList.remove('visible');
      saveState();
      draw();
    });

    document.querySelectorAll('.player-name-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const num = parseInt(btn.dataset.player, 10);
        openAnimalModal(num);
      });
    });

    document.getElementById('modalCancel').addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    // Запуск
    loadState();
    currentPlayer = firstMover;
    
    p1AvatarEl.textContent = player1Animal;
    p2AvatarEl.textContent = player2Animal;
    
    setTimeout(() => {
      resizeCanvas();
      updateStats();
      updateTurnUI();
      updateScoreUI();
    }, 50);

  </script>
</body>
</html>
